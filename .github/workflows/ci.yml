name: CI

# Runs every test on every pull request and on pushes to main. Deploys only after all checks pass:
#   - pull requests from this repo  -> Cloudflare Pages preview URL
#   - pushes to main                -> production

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel a run on main: it may be mid-deploy to production.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  pipeline:
    name: Pipeline (lint, tests, coverage)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check pipeline spike scripts
      - run: python -m pytest --cov=pipeline --cov-report=term-missing --cov-fail-under=90

  web:
    name: Web (typecheck, tests, coverage, build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run coverage
      - run: npm run build

  red-green:
    name: Tests bite (red without implementation, green with it)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: pip install -r requirements-dev.txt
      - run: npm ci
        working-directory: web
      - run: python scripts/prove_red_green.py

  deploy:
    name: Deploy to Cloudflare Pages
    needs: [pipeline, web, red-green]
    # Production on push to main; previews for pull requests opened from this repository (forks never get secrets).
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: deploy-${{ github.ref }}
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROJECT: ${{ vars.CF_PAGES_PROJECT || 'minhbachdauthau' }}
      BRANCH: ${{ github.event_name == 'pull_request' && github.head_ref || 'main' }}
      WRANGLER_VERSION: 4.147.0  # pinned; bump deliberately
    steps:
      - name: Check deploy credentials
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Missing CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID repository secrets. See memory-bank/techContext.md."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      # Sample data until the crawler exists (docs/data-contract.md). Swap this step for the crawler output later.
      - name: Build site data (sample)
        run: python pipeline/make_sample.py && python pipeline/build_site_data.py --sample
      - name: Build site
        working-directory: web
        run: npm ci && npm run build
      - name: Create Pages project if it does not exist
        run: |
          npx --yes wrangler@${WRANGLER_VERSION} pages project list | grep -qw "$PROJECT" \
            || npx --yes wrangler@${WRANGLER_VERSION} pages project create "$PROJECT" --production-branch=main
      - name: Deploy
        id: deploy
        run: |
          npx --yes wrangler@${WRANGLER_VERSION} pages deploy web/dist --project-name="$PROJECT" --branch="$BRANCH" --commit-dirty=true | tee deploy.log
          url=$(grep -oE 'https://[a-zA-Z0-9.-]+\.pages\.dev' deploy.log | tail -1)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "### Deployed: $url" >> "$GITHUB_STEP_SUMMARY"
